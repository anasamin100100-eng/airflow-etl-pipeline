version: '3.7'

services:

  postgres:
    image: postgres:9.6
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    logging:
      options:
        max-size: 10m
        max-file: "3"

  mysql:
  image: mysql:5.7.27
  environment:
    - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mysql_data:/var/lib/mysql-files/
      - ./mysql.cnf:/etc/mysql/mysql.cnf

  webserver:
    image: puckel/docker-airflow:1.10.9
    restart: always
    depends_on:
      - postgres
      - mysql
    environment:
  - INSTALL_MYSQL=y
  - LOAD_EX=n
  - EXECUTOR=Local

  - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}

  - AIRFLOW__SMTP__SMTP_HOST=${SMTP_HOST}
  - AIRFLOW__SMTP__SMTP_USER=${SMTP_USER}
  - AIRFLOW__SMTP__SMTP_PASSWORD=${SMTP_PASSWORD}
  - AIRFLOW__SMTP__SMTP_PORT=${SMTP_PORT}
  - AIRFLOW__SMTP__SMTP_MAIL_FROM=${SMTP_MAIL_FROM}
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ./ip_files:/usr/local/airflow/ip_files
      - ./op_files:/usr/local/airflow/op_files
      - ./mysql_data:/usr/local/airflow/mysql_data
      # - ./plugins:/usr/local/airflow/plugins
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "[ -f /usr/local/airflow/airflow-webserver.pid ]"]
      interval: 30s
      timeout: 30s
      retries: 3